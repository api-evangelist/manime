description: 'ManiMe (Manime) is a direct-to-consumer beauty company offering custom-fit
  semi-cured gel manicure and pedicure kits. Customers scan their nails with a smartphone
  and ManiMe manufactures made-to-measure gel nail sets shipped to the home for at-home
  application. The company was backed by Canaan Partners and Techstars. As of this
  enrichment pass the manime.co storefront (a Shopify store) returns HTTP 402 "Store
  unavailable", indicating the store is currently closed or inactive. No public developer
  API, API documentation, developer portal, SDKs, or webhook surface could be found.'
